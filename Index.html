<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaroSphere</title>
    <!-- Font: Poppins for a clean, modern Swiss look -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0A;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            font-family: 'Poppins', system-ui, sans-serif;
            color: #FFFFFF;
            overflow: hidden;
        }

        /* ---------- CANVAS (WEATHER EFFECTS) ---------- */
        #weatherCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ---------- MAIN CARD (SWISS GRID) ---------- */
        .app-card {
            position: relative;
            z-index: 1;
            max-width: 960px;
            width: 100%;
            background: #111111;
            border: 1px solid #222222;
            border-radius: 0;
            padding: 3rem 3.5rem 3.5rem;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto auto auto auto auto;
            gap: 0;
        }

        /* ---------- HEADER (GRID ROW 1) ---------- */
        .app-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #FFFFFF;
        }

        .app-header .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: #FFFFFF;
        }

        .app-header .logo span {
            font-weight: 300;
            color: #888888;
            margin-left: 0.25rem;
        }

        .app-header .header-right {
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #666666;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        /* ---------- TIMEZONE BAR (GRID ROW 2) ---------- */
        .timezone-bar {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1.5rem;
            padding: 0.85rem 0;
            border-bottom: 1px solid #222222;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #666666;
        }

        .timezone-bar .tz-label {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: #555555;
        }

        .timezone-bar .tz-value {
            font-size: 0.75rem;
            font-weight: 400;
            color: #CCCCCC;
            letter-spacing: 0.3px;
            text-transform: none;
            text-align: center;
        }

        .timezone-bar .tz-offset {
            font-size: 0.65rem;
            font-weight: 300;
            color: #555555;
            text-align: right;
            letter-spacing: 0.3px;
        }

        /* ---------- STATUS BAR (GRID ROW 3) ---------- */
        .status-bar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0 1.25rem;
            border-bottom: 1px solid #222222;
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #666666;
        }

        .status-bar .left-meta {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .status-bar .left-meta .updated {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-bar .right-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .status-bar .right-controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #888888;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-bar .right-controls input[type="checkbox"] {
            accent-color: #FFFFFF;
            width: 12px;
            height: 12px;
            cursor: pointer;
        }

        .status-bar .right-controls .refresh-btn {
            background: none;
            border: 1px solid #333333;
            color: #AAAAAA;
            padding: 0.25rem 0.9rem;
            border-radius: 0;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        .status-bar .right-controls .refresh-btn:hover {
            background: #FFFFFF;
            color: #111111;
            border-color: #FFFFFF;
        }

        /* ---------- SEARCH (GRID ROW 4) ---------- */
        .search-wrap {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0;
            margin: 1.5rem 0 2.5rem;
            border: 1px solid #222222;
        }

        .search-wrap input {
            padding: 1rem 1.5rem;
            background: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 0.95rem;
            font-weight: 400;
            outline: none;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
        }

        .search-wrap input::placeholder {
            color: #444444;
            font-weight: 300;
        }

        .search-wrap input:focus {
            background: #1A1A1A;
        }

        .search-wrap button {
            padding: 0 2rem;
            background: #FFFFFF;
            border: none;
            color: #111111;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        .search-wrap button:hover {
            background: #CCCCCC;
        }

        /* ---------- MAIN WEATHER (GRID ROW 5) ---------- */
        .weather-main {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #222222;
        }

        .weather-main .city-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .weather-main .city-block .city-name {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: -1px;
            line-height: 1.1;
            color: #FFFFFF;
        }

        .weather-main .city-block .city-name span {
            font-weight: 300;
            font-size: 1.1rem;
            color: #666666;
            margin-left: 0.5rem;
        }

        .weather-main .city-block .weather-desc {
            font-size: 0.85rem;
            font-weight: 400;
            color: #888888;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            margin-top: 0.25rem;
        }

        .weather-main .temp-block {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
        }

        .weather-main .temp-block .temp-large {
            font-size: 6rem;
            font-weight: 300;
            letter-spacing: -4px;
            line-height: 1;
            color: #FFFFFF;
        }

        .weather-main .temp-block .temp-large sup {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0;
            color: #666666;
            margin-left: 4px;
        }

        .weather-main .temp-block .feels-like {
            font-size: 0.75rem;
            font-weight: 300;
            color: #666666;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 0.25rem;
        }

        /* ---------- STATS (GRID ROW 6) ---------- */
        .stats-grid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            border: 1px solid #222222;
            margin-bottom: 2.5rem;
        }

        .stat-item {
            padding: 1.25rem 1.5rem;
            border-right: 1px solid #222222;
            display: flex;
            flex-direction: column;
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-item .stat-label {
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #555555;
        }

        .stat-item .stat-value {
            font-size: 1.5rem;
            font-weight: 300;
            color: #FFFFFF;
            margin-top: 0.25rem;
            letter-spacing: -0.5px;
        }

        .stat-item .stat-value small {
            font-size: 0.7rem;
            font-weight: 300;
            color: #666666;
            margin-left: 2px;
        }

        /* ---------- FORECAST (GRID ROW 7) ---------- */
        .forecast-section {
            grid-column: 1 / -1;
        }

        .forecast-section .forecast-title {
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555555;
            margin-bottom: 1rem;
        }

        .forecast-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0;
            border: 1px solid #222222;
        }

        .forecast-day {
            padding: 1.2rem 0.5rem;
            text-align: center;
            border-right: 1px solid #222222;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .forecast-day:last-child {
            border-right: none;
        }

        .forecast-day .day {
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #555555;
        }

        .forecast-day .icon-sm img {
            width: 40px;
            height: 40px;
            filter: brightness(1.2);
        }

        .forecast-day .temp {
            font-size: 1.1rem;
            font-weight: 300;
            color: #FFFFFF;
            letter-spacing: -0.3px;
        }

        .forecast-day .temp small {
            font-size: 0.6rem;
            color: #666666;
            font-weight: 300;
        }

        /* ---------- STATUS / ERROR ---------- */
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            font-size: 0.9rem;
            font-weight: 300;
            color: #666666;
            letter-spacing: 0.5px;
        }

        .status-message.error {
            color: #FF6B6B;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 800px) {
            .app-card {
                padding: 2rem;
            }

            .weather-main {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .weather-main .temp-block {
                align-items: flex-start;
            }

            .weather-main .temp-block .temp-large {
                font-size: 4.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-item {
                border-right: none;
                border-bottom: 1px solid #222222;
            }

            .stat-item:last-child {
                border-bottom: none;
            }

            .forecast-list {
                grid-template-columns: repeat(3, 1fr);
            }

            .forecast-day {
                border-bottom: 1px solid #222222;
            }

            .forecast-day:nth-child(3n) {
                border-right: none;
            }

            .forecast-day:last-child {
                border-right: none;
            }

            .timezone-bar {
                grid-template-columns: 1fr;
                gap: 0.25rem;
                text-align: left;
            }

            .timezone-bar .tz-value {
                text-align: left;
            }

            .timezone-bar .tz-offset {
                text-align: left;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 0.5rem;
            }

            .app-card {
                padding: 1.5rem;
            }

            .app-header {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-start;
            }

            .app-header .header-right {
                font-size: 0.6rem;
                gap: 1rem;
            }

            .weather-main .city-block .city-name {
                font-size: 1.8rem;
            }

            .weather-main .temp-block .temp-large {
                font-size: 3.5rem;
            }

            .forecast-list {
                grid-template-columns: repeat(2, 1fr);
            }

            .forecast-day:nth-child(3n) {
                border-right: 1px solid #222222;
            }

            .forecast-day:nth-child(2n) {
                border-right: none;
            }

            .search-wrap {
                grid-template-columns: 1fr;
            }

            .search-wrap button {
                padding: 1rem;
            }

            .timezone-bar {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas for weather effects -->
    <canvas id="weatherCanvas"></canvas>

    <div class="app-card" id="app">
        <!-- HEADER -->
        <div class="app-header">
            <div class="logo">BaroSphere<span>.ch</span></div>
            <div class="header-right">
                <span id="headerDate">—</span>
            </div>
        </div>

        <!-- TIMEZONE BAR -->
        <div class="timezone-bar">
            <span class="tz-label">Your Timezone</span>
            <span class="tz-value" id="timezoneValue">—</span>
            <span class="tz-offset" id="timezoneOffset">—</span>
        </div>

        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="left-meta">
                <div class="updated">
                    <span class="dot" id="statusDot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ADE80;"></span>
                    <span id="lastUpdatedText">Loading...</span>
                </div>
            </div>
            <div class="right-controls">
                <label>
                    <input type="checkbox" id="autoRefreshToggle" checked />
                    Auto-refresh
                </label>
                <button class="refresh-btn" id="manualRefreshBtn">↻ Refresh</button>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search city…" value="Punxsutawney" list="cityList" />
            <datalist id="cityList"></datalist>
            <button id="searchBtn">Search</button>
        </div>

        <!-- WEATHER CONTENT -->
        <div id="weatherContent">
            <div class="weather-main">
                <div class="city-block">
                    <div class="city-name" id="cityName">Punxsutawney <span>US</span></div>
                    <div class="weather-desc" id="descText">loading…</div>
                </div>
                <div class="temp-block">
                    <div class="temp-large" id="tempLarge">--<sup>°C</sup></div>
                    <div class="feels-like" id="feelsLike">Feels like --°</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Humidity</div>
                    <div class="stat-value" id="humidity">--<small>%</small></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Wind</div>
                    <div class="stat-value" id="windSpeed">--<small>m/s</small></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Pressure</div>
                    <div class="stat-value" id="pressure">--<small>hPa</small></div>
                </div>
            </div>

            <div class="forecast-section">
                <div class="forecast-title">5-Day Forecast</div>
                <div class="forecast-list" id="forecastList"></div>
            </div>
        </div>

        <!-- STATUS MESSAGE -->
        <div id="statusMessage" class="status-message hidden"></div>
    </div>

    <script>
        (function() {
            // ---------- CONFIG ----------
            const API_KEY = 'bd5e378503939ddaee76f12ad7a97608';
            const BASE_URL = 'https://api.openweathermap.org/data/2.5/';
            const REFRESH_INTERVAL = 5 * 60 * 1000; // 5 minutes

            // ---------- CITIES ----------
            const CITIES = [
                "Abu Dhabi", "Abuja", "Accra", "Addis Ababa", "Ahmedabad", "Algiers", "Amman", "Amsterdam",
                "Anchorage", "Andorra la Vella", "Ankara", "Antananarivo", "Apia", "Ashgabat", "Asmara",

                "Paris", "Perth", "Philadelphia", "Phoenix", "Portland", "Porto", "Prague", "Pretoria",
                "Punxsutawney", "Quito", "Rabat", "Raleigh", "Reykjavik", "Riga", "Rio de Janeiro", "Riyadh",
                "Rome", "Sacramento", "Saint Petersburg", "Salt Lake City", "San Antonio", "San Diego",
                "San Francisco", "San Jose", "San Juan", "San Salvador", "Santiago", "Santo Domingo",
                "São Paulo", "Sapporo", "Seattle", "Seoul", "Shanghai", "Singapore", "Sofia", "St. Louis",
                "Stockholm", "Stuttgart", "Sydney", "Taipei", "Tallinn", "Tashkent", "Tbilisi", "Tegucigalpa",
                "Tehran", "Tel Aviv", "Tijuana", "Tirana", "Tokyo", "Toronto", "Tripoli", "Tucson",
                "Tunis", "Turin", "Ulaanbaatar", "Valencia", "Vancouver", "Vienna", "Vilnius", "Warsaw",
                "Washington D.C.", "Wellington", "Winnipeg", "Yaoundé", "Yerevan", "Zagreb", "Zurich"
            ].sort();

            // ---------- DOM REFS ----------
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const cityName = document.getElementById('cityName');
            const tempLarge = document.getElementById('tempLarge');
            const descText = document.getElementById('descText');
            const feelsLike = document.getElementById('feelsLike');
            const humidity = document.getElementById('humidity');
            const windSpeed = document.getElementById('windSpeed');
            const pressure = document.getElementById('pressure');
            const forecastList = document.getElementById('forecastList');
            const statusMessage = document.getElementById('statusMessage');
            const weatherContent = document.getElementById('weatherContent');
            const lastUpdatedText = document.getElementById('lastUpdatedText');
            const statusDot = document.getElementById('statusDot');
            const autoRefreshToggle = document.getElementById('autoRefreshToggle');
            const manualRefreshBtn = document.getElementById('manualRefreshBtn');
            const timezoneValue = document.getElementById('timezoneValue');
            const timezoneOffset = document.getElementById('timezoneOffset');
            const headerDate = document.getElementById('headerDate');

            // ---------- STATE ----------
            let currentCity = 'Punxsutawney';
            let refreshTimer = null;
            let isRefreshing = false;

            // ---------- CANVAS & PARTICLES ----------
            const canvas = document.getElementById('weatherCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let animId = null;
            let currentWeather = 'clear';

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class RainDrop {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - canvas.height;
                    this.length = 8 + Math.random() * 12;
                    this.speed = 7 + Math.random() * 10;
                    this.opacity = 0.15 + Math.random() * 0.25;
                    this.width = 0.8 + Math.random() * 1.2;
                }
                update() {
                    this.y += this.speed;
                    if (this.y > canvas.height) { this.reset();
                        this.y = -10; }
                }
                draw() {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - 1.5, this.y + this.length);
                    ctx.strokeStyle = `rgba(160, 200, 255, ${this.opacity})`;
                    ctx.lineWidth = this.width;
                    ctx.stroke();
                }
            }

            class SnowFlake {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - canvas.height;
                    this.radius = 1.5 + Math.random() * 4;
                    this.speed = 0.8 + Math.random() * 2;
                    this.wobble = Math.random() * 0.02;
                    this.phase = Math.random() * Math.PI * 2;
                    this.opacity = 0.3 + Math.random() * 0.4;
                }
                update() {
                    this.y += this.speed;
                    this.x += Math.sin(this.phase) * 0.4;
                    this.phase += this.wobble;
                    if (this.y > canvas.height + 20) { this.reset();
                        this.y = -10; }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.fill();
                }
            }

            class SunParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.radius = 1 + Math.random() * 2.5;
                    this.opacity = 0.05 + Math.random() * 0.15;
                    this.phase = Math.random() * Math.PI * 2;
                }
                update() {
                    this.phase += 0.008;
                    this.x += Math.sin(this.phase) * 0.15;
                    this.y += Math.cos(this.phase * 0.6) * 0.15;
                    if (this.x < -20) this.x = canvas.width + 20;
                    if (this.x > canvas.width + 20) this.x = -20;
                    if (this.y < -20) this.y = canvas.height + 20;
                    if (this.y > canvas.height + 20) this.y = -20;
                }
                draw() {
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 2.5);
                    grad.addColorStop(0, `rgba(255, 230, 150, ${this.opacity})`);
                    grad.addColorStop(1, `rgba(255, 200, 100, 0)`);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                }
            }

            class CloudParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = 10 + Math.random() * canvas.height * 0.3;
                    this.radius = 30 + Math.random() * 80;
                    this.speed = 0.08 + Math.random() * 0.2;
                    this.opacity = 0.02 + Math.random() * 0.04;
                }
                update() {
                    this.x += this.speed;
                    if (this.x > canvas.width + this.radius) {
                        this.x = -this.radius;
                        this.y = 10 + Math.random() * canvas.height * 0.3;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(200, 215, 240, ${this.opacity})`;
                    ctx.fill();
                }
            }

            function initParticles(weatherType) {
                particles = [];
                const count = weatherType === 'rain' ? 200 :
                    weatherType === 'snow' ? 120 :
                    weatherType === 'clear' ? 50 :
                    weatherType === 'clouds' ? 25 : 50;

                for (let i = 0; i < count; i++) {
                    if (weatherType === 'rain') particles.push(new RainDrop());
                    else if (weatherType === 'snow') particles.push(new SnowFlake());
                    else if (weatherType === 'clear') particles.push(new SunParticle());
                    else if (weatherType === 'clouds') particles.push(new CloudParticle());
                    else particles.push(new SunParticle());
                }
                currentWeather = weatherType;
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let p of particles) {
                    p.update();
                    p.draw();
                }
                animId = requestAnimationFrame(animateParticles);
            }

            function setWeatherEffect(weatherMain, temp) {
                let type = 'clear';
                const main = weatherMain ? weatherMain.toLowerCase() : '';

                if (main.includes('rain') || main.includes('drizzle') || main.includes('thunderstorm')) {
                    type = 'rain';
                } else if (main.includes('snow')) {
                    type = 'snow';
                } else if (main.includes('cloud')) {
                    type = 'clouds';
                } else if (main.includes('clear')) {
                    type = 'clear';
                } else {
                    if (temp !== undefined && temp < 0) type = 'snow';
                    else if (temp !== undefined && temp > 25) type = 'clear';
                    else type = 'clouds';
                }

                if (type !== currentWeather) {
                    initParticles(type);
                }
                if (!animId) animateParticles();
            }

            // ---------- POPULATE CITY LIST ----------
            function populateCityList() {
                const datalist = document.getElementById('cityList');
                datalist.innerHTML = '';
                CITIES.forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city;
                    datalist.appendChild(opt);
                });
            }
            populateCityList();

            // ---------- HELPERS ----------
            function showStatus(msg, isError = false) {
                statusMessage.textContent = msg;
                statusMessage.className = 'status-message' + (isError ? ' error' : '');
                statusMessage.classList.remove('hidden');
                weatherContent.classList.add('hidden');
            }

            function hideStatus() {
                statusMessage.classList.add('hidden');
                weatherContent.classList.remove('hidden');
            }

            function formatDate(ts) {
                return new Date(ts * 1000).toLocaleDateString('en-US', { weekday: 'short' });
            }

            function updateLastUpdated() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                lastUpdatedText.textContent = `Updated ${timeStr}`;
                statusDot.style.background = '#4ADE80';
            }

            function setRefreshingState(refreshing) {
                isRefreshing = refreshing;
                if (refreshing) {
                    statusDot.style.background = '#FBBF24';
                    statusDot.style.animation = 'pulse-dot 0.6s infinite';
                    lastUpdatedText.textContent = 'Refreshing...';
                } else {
                    statusDot.style.animation = 'pulse-dot 1.5s infinite';
                    updateLastUpdated();
                }
            }

            // ---------- AUTO-DETECT USER TIMEZONE ----------
            function updateUserTimezone() {
                const now = new Date();
                const offsetMinutes = -now.getTimezoneOffset();
                const offsetHours = Math.floor(Math.abs(offsetMinutes) / 60);
                const offsetMins = Math.abs(offsetMinutes) % 60;
                const sign = offsetMinutes >= 0 ? '+' : '-';
                const offsetStr = `UTC${sign}${String(offsetHours).padStart(2, '0')}:${String(offsetMins).padStart(2, '0')}`;

                const dateStr = now.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                const timeStr = now.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });

                timezoneValue.textContent = `${dateStr} · ${timeStr}`;
                timezoneOffset.textContent = offsetStr;
                headerDate.textContent = offsetStr;
            }

            // ---------- FORECAST ----------
            function renderForecast(forecastData) {
                const dailyMap = new Map();
                const today = new Date().setHours(0, 0, 0, 0);
                forecastData.forEach(item => {
                    const dt = new Date(item.dt * 1000);
                    const dayStart = new Date(dt).setHours(0, 0, 0, 0);
                    if (dayStart < today) return;
                    if (!dailyMap.has(dayStart)) dailyMap.set(dayStart, []);
                    dailyMap.get(dayStart).push(item);
                });
                const days = Array.from(dailyMap.entries()).sort((a, b) => a[0] - b[0]).slice(0, 5);
                if (days.length === 0) {
                    forecastList.innerHTML = `<div class="forecast-day" style="grid-column:1/-1;text-align:center;color:#555;">No forecast</div>`;
                    return;
                }
                let html = '';
                days.forEach(([dayStart, items]) => {
                    const mid = Math.floor(items.length / 2);
                    const sample = items[mid] || items[0];
                    const dayName = formatDate(sample.dt);
                    const icon = sample.weather[0]?.icon || '01d';
                    const temp = Math.round(sample.main.temp);
                    html += `
                        <div class="forecast-day">
                            <div class="day">${dayName}</div>
                            <div class="icon-sm"><img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${sample.weather[0]?.description}" width="40" height="40"></div>
                            <div class="temp">${temp}<small>°C</small></div>
                        </div>
                    `;
                });
                forecastList.innerHTML = html;
            }

            // ---------- FETCH WEATHER ----------
            async function fetchWeather(city, showLoading = true) {
                if (!city || city.trim() === '') {
                    showStatus('Please enter a city name.', true);
                    return;
                }
                city = city.trim();

                if (showLoading && !isRefreshing) {
                    showStatus('Loading weather …');
                } else if (isRefreshing) {
                    setRefreshingState(true);
                }

                try {
                    const currentRes = await fetch(`${BASE_URL}weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`);
                    if (!currentRes.ok) {
                        if (currentRes.status === 404) throw new Error(`City "${city}" not found.`);
                        else if (currentRes.status === 401) throw new Error('API key error.');
                        else throw new Error(`Server error (${currentRes.status}).`);
                    }
                    const currentData = await currentRes.json();

                    const forecastRes = await fetch(`${BASE_URL}forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`);
                    if (!forecastRes.ok) throw new Error('Could not fetch forecast.');
                    const forecastData = await forecastRes.json();

                    const { name, sys, main, weather, wind } = currentData;
                    const weatherMain = weather[0]?.main || '';
                    const temp = main.temp;

                    cityName.innerHTML = `${name} <span>${sys.country || ''}</span>`;
                    tempLarge.innerHTML = `${Math.round(temp)}<sup>°C</sup>`;
                    descText.textContent = weather[0]?.description || '–';
                    feelsLike.textContent = `Feels like ${Math.round(main.feels_like)}°`;
                    humidity.innerHTML = `${main.humidity}<small>%</small>`;
                    windSpeed.innerHTML = `${wind.speed.toFixed(1)}<small>m/s</small>`;
                    pressure.innerHTML = `${main.pressure}<small>hPa</small>`;

                    setWeatherEffect(weatherMain, temp);
                    renderForecast(forecastData.list);
                    hideStatus();

                    currentCity = name;
                    searchInput.value = name;

                    updateLastUpdated();
                    if (isRefreshing) setRefreshingState(false);

                } catch (err) {
                    console.warn('Weather error:', err);
                    showStatus(err.message || 'Something went wrong.', true);
                    forecastList.innerHTML = '';
                    if (isRefreshing) setRefreshingState(false);
                }
            }

            // ---------- AUTO-REFRESH ----------
            function startAutoRefresh() {
                stopAutoRefresh();
                if (autoRefreshToggle.checked) {
                    refreshTimer = setInterval(() => {
                        if (currentCity) {
                            setRefreshingState(true);
                            fetchWeather(currentCity, false);
                        }
                    }, REFRESH_INTERVAL);
                }
            }

            function stopAutoRefresh() {
                if (refreshTimer) {
                    clearInterval(refreshTimer);
                    refreshTimer = null;
                }
            }

            // ---------- EVENT LISTENERS ----------
            function handleSearch() {
                let city = searchInput.value.trim();
                if (!city) {
                    showStatus('Enter a city name.', true);
                    return;
                }
                stopAutoRefresh();
                fetchWeather(city, true);
                setTimeout(startAutoRefresh, 500);
            }

            searchBtn.addEventListener('click', handleSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSearch();
                }
            });

            autoRefreshToggle.addEventListener('change', () => {
                if (autoRefreshToggle.checked) startAutoRefresh();
                else stopAutoRefresh();
            });

            manualRefreshBtn.addEventListener('click', () => {
                if (currentCity) {
                    setRefreshingState(true);
                    fetchWeather(currentCity, false);
                }
            });

            // ---------- INIT ----------
            window.addEventListener('load', () => {
                updateUserTimezone();
                setInterval(updateUserTimezone, 1000);

                searchInput.value = 'Punxsutawney';
                fetchWeather('Punxsutawney', true);
                animateParticles();
                setTimeout(startAutoRefresh, 2000);
            });

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && !animId) animateParticles();
                if (!document.hidden && autoRefreshToggle.checked) startAutoRefresh();
            });

        })();
    </script>
</body>
</html>
